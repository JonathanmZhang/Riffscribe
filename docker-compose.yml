services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  worker:
    build: ./worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MAX_AUDIO_DURATION_SECONDS=300
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      # Build args, not runtime env: NEXT_PUBLIC_* are baked into the JS
      # bundle at `next build`. Changing these requires
      # `docker compose up -d --build frontend`.
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_ENABLE_URL_INGESTION=true
    ports:
      - "3000:3000"
    depends_on:
      - backend
