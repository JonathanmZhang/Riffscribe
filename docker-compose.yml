services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  worker:
    build: ./worker
    # Default queue only (ingest, transcribe, map). Concurrency 2: this is a
    # single-user local app, and each process loads its own TensorFlow model.
    command: celery -A tasks.celery_app worker --loglevel=info -Q celery --concurrency 2 -n main@%h
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - MAX_AUDIO_DURATION_SECONDS=300
      # Also read here: ingest_audio checks it early for isolate_guitar jobs.
      - MAX_SEPARATION_DURATION_SECONDS=120
      # transcribe: notes >= this also kept when they start with a confident
      # (>= 0.5) note, i.e. chord tones; >= 0.5 disables.
      - CHORD_TONE_CONFIDENCE_FLOOR=0.45
      # transcribe: merge same-pitch re-triggers (gap <= this, and a weak
      # attack below the onset gate) into one note; empty gap disables.
      - RETRIGGER_MERGE_GAP_SECONDS=0.04
      - RETRIGGER_MAX_ONSET_ACTIVATION=0.6
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  worker-separation:
    build: ./worker
    # Guitar separation only, one at a time: each Demucs run needs ~3GB RAM.
    command: celery -A tasks.celery_app worker --loglevel=info -Q separation --concurrency 1 -n separation@%h
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DEMUCS_MODEL=htdemucs_6s
      - DEMUCS_SHIFTS=1
      - MAX_SEPARATION_DURATION_SECONDS=120
      - SEPARATION_SOFT_TIME_LIMIT_SECONDS=900
      # Torch intra-op threads; empty = half the container's CPUs.
      - SEPARATION_TORCH_THREADS=
    depends_on:
      - redis
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
      # Build args, not runtime env: NEXT_PUBLIC_* are baked into the JS
      # bundle at `next build`. Changing these requires
      # `docker compose up -d --build frontend`.
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
        - NEXT_PUBLIC_ENABLE_URL_INGESTION=true
    ports:
      - "3000:3000"
    depends_on:
      - backend
